<div class="page">
  <div class="page-head">
    <nav class="breadcrumb" aria-label="Breadcrumb"><span class="current">{{ title() | translate }}</span></nav>
  </div>
  <div class="page-body">
    <div class="soon">
      <span class="big-icon"><i class="icon pi pi-wrench"></i></span>
      <h1 class="page-title">{{ 'comingSoon.title' | translate }}</h1>
      <p class="muted">{{ 'comingSoon.lead' | translate }}</p>
      <p class="muted">{{ 'comingSoon.apiReady' | translate }}</p>
      <a pButton size="small" routerLink="/dashboard" [text]="true">
        <i class="pi pi-arrow-left" pButtonIcon></i><span pButtonLabel>{{ 'dashboard.title' | translate }}</span>
      </a>
    </div>
  </div>
</div>
