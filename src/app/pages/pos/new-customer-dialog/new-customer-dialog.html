<p-dialog [(visible)]="visible" [modal]="true" [draggable]="false" styleClass="ms-dialog" [style]="{ width: 'min(420px, 96vw)' }"
          [header]="'partners.newCustomer' | translate">
  <form class="ms-form" [formGroup]="form" (ngSubmit)="save()" novalidate id="pos-customer-form">
    <div class="ms-field">
      <label msLabel for="pc-name" control="name">{{ 'partners.name' | translate }}</label>
      <input pInputText id="pc-name" formControlName="name" autocomplete="off" />
    </div>
    <div class="ms-field">
      <label msLabel for="pc-phone" control="phone" error="errors.phone">{{ 'partners.phone' | translate }}</label>
      <input pInputText id="pc-phone" type="tel" formControlName="phone" autocomplete="off" />
      <small class="field-hint">{{ 'pos.customerPhoneHint' | translate }}</small>
    </div>
  </form>
  <ng-template #footer>
    <button pButton type="button" [text]="true" (click)="visible.set(false)"><span pButtonLabel>{{ 'common.cancel' | translate }}</span></button>
    <button pButton type="submit" form="pos-customer-form" [loading]="busy()" [disabled]="busy()">
      <span pButtonLabel>{{ 'common.save' | translate }}</span>
    </button>
  </ng-template>
</p-dialog>
