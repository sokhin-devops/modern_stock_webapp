<p-dialog [(visible)]="visible" [modal]="true" [draggable]="false" styleClass="ms-dialog"
          [header]="(shift() ? 'pos.closeShift' : 'pos.openShift') | translate">
  <div class="ms-form">
    @if (shift(); as s) {
      <div class="expected">
        <span class="muted">{{ 'pos.shiftSince' | translate: { time: (s.openedAt | date: 'HH:mm') } }}</span>
        <div><small>{{ 'pos.expected' | translate }}</small><b class="num">${{ s.expectedUsd | number: '1.2-2' }} · ៛{{ s.expectedKhr | number: '1.0-0' }}</b></div>
      </div>
    }
    <div class="ms-form-row">
      <div class="ms-field">
        <label msLabel for="shift-usd">{{ (shift() ? 'pos.countedUsd' : 'pos.openingUsd') | translate }}</label>
        <p-inputnumber inputId="shift-usd" [ngModel]="usd()" (ngModelChange)="usd.set($event)" mode="currency" currency="USD"
                       locale="en-US" [min]="0" />
      </div>
      <div class="ms-field">
        <label msLabel for="shift-khr">{{ (shift() ? 'pos.countedKhr' : 'pos.openingKhr') | translate }}</label>
        <p-inputnumber inputId="shift-khr" [ngModel]="khr()" (ngModelChange)="khr.set($event)" prefix="៛" locale="en-US" [min]="0" [step]="100" />
      </div>
    </div>
    @if (shift()) {
      <div class="ms-field">
        <label msLabel for="shift-note" optional>{{ 'pos.note' | translate }}</label>
        <input pInputText id="shift-note" [ngModel]="note()" (ngModelChange)="note.set($event)" />
      </div>
    }
  </div>
  <ng-template #footer>
    <button pButton type="button" [text]="true" (click)="visible.set(false)"><span pButtonLabel>{{ 'common.cancel' | translate }}</span></button>
    <button pButton type="button" (click)="submit()" [loading]="busy()" [disabled]="busy()">
      <span pButtonLabel>{{ (shift() ? 'pos.closeShift' : 'pos.openShift') | translate }}</span>
    </button>
  </ng-template>
</p-dialog>
