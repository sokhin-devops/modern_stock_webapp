<form class="ms-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="ms-field">
    <p-floatlabel variant="on">
      <input pInputText id="nameEn" formControlName="nameEn" placeholder="Sokha Mini-mart" />
      <label for="nameEn">{{ 'account.nameEn' | translate }} *</label>
    </p-floatlabel>
    @if (showError(form.controls.nameEn)) {
      <small class="field-error">{{ 'common.required' | translate }}</small>
    }
  </div>
  <div class="ms-field">
    <p-floatlabel variant="on">
      <input pInputText id="nameKm" formControlName="nameKm" placeholder="ហាងសុខា មីនីម៉ាត" />
      <label for="nameKm">{{ 'account.nameKm' | translate }} ({{ 'common.optional' | translate }})</label>
    </p-floatlabel>
  </div>
  <div class="ms-field">
    <p-floatlabel variant="on">
      <p-select inputId="businessType" formControlName="businessType" [options]="types()" optionLabel="label"
                optionValue="value" appendTo="body" />
      <label for="businessType">{{ 'account.type' | translate }} *</label>
    </p-floatlabel>
  </div>

  <div class="dialog-actions">
    <span class="tag tag-primary"><i class="icon pi pi-star"></i>{{ 'account.trialTag' | translate }}</span>
    <span class="spacer"></span>
    <button pButton type="button" [text]="true" (click)="ref.close()"><span pButtonLabel>{{ 'common.cancel' | translate }}</span></button>
    <button pButton type="submit" [loading]="busy()" [disabled]="busy()"><span pButtonLabel>{{ 'common.create' | translate }}</span></button>
  </div>
</form>
