<form class="ms-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="ms-field">
    <label msLabel for="nameEn" control="nameEn">{{ 'account.nameEn' | translate }}</label>
    <input pInputText id="nameEn" formControlName="nameEn" placeholder="Sokha Mini-mart" />
  </div>
  <div class="ms-field">
    <label msLabel for="nameKm" control="nameKm" optional>{{ 'account.nameKm' | translate }}</label>
    <input pInputText id="nameKm" formControlName="nameKm" placeholder="ហាងសុខា មីនីម៉ាត" />
  </div>
  <div class="ms-field">
    <label msLabel for="businessType" control="businessType">{{ 'account.type' | translate }}</label>
    <p-select inputId="businessType" formControlName="businessType" [options]="types()" optionLabel="label"
              optionValue="value" appendTo="body" />
  </div>

  <div class="dialog-actions">
    <span class="tag tag-primary"><i class="icon pi pi-star"></i>{{ 'account.trialTag' | translate: { days: platform.trialDays() } }}</span>
    <span class="spacer"></span>
    <button pButton type="submit" [loading]="busy()" [disabled]="busy()"><span pButtonLabel>{{ 'common.create' | translate }}</span></button>
  </div>
</form>
