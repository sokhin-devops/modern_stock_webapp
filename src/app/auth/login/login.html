<ms-auth-frame [title]="'auth.signInTitle' | translate">
  <form class="ms-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (expired()) {
      <p class="form-note" role="status"><i class="icon pi pi-clock"></i>{{ 'errors.sessionExpired' | translate }}</p>
    }

    <div class="ms-field">
      <label msLabel for="login" control="login">{{ 'auth.login' | translate }}</label>
      <input pInputText id="login" formControlName="login" autocomplete="username" autocapitalize="off" />
    </div>

    <div class="ms-field">
      <label msLabel for="password" control="password">{{ 'auth.password' | translate }}</label>
      <div class="ms-password">
        <input pInputText id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
               autocomplete="current-password" />
        <button pButton type="button" class="reveal" [rounded]="true" [text]="true" severity="secondary"
                (click)="showPassword.set(!showPassword())" [attr.aria-pressed]="showPassword()"
                [attr.aria-label]="(showPassword() ? 'auth.hidePassword' : 'auth.showPassword') | translate">
          <i class="pi" [class.pi-eye]="!showPassword()" [class.pi-eye-slash]="showPassword()" pButtonIcon></i>
        </button>
      </div>
    </div>

    @if (error()) {
      <p class="form-error" role="alert"><i class="icon pi pi-exclamation-circle"></i>{{ error() }}</p>
    }

    <div class="auth-actions">
      <a routerLink="/forgot-password">{{ 'auth.forgot' | translate }}</a>
      <button pButton type="submit" class="submit" [loading]="busy()" [disabled]="busy()">
        <span pButtonLabel>{{ 'auth.signIn' | translate }}</span>
      </button>
    </div>
    <p class="auth-switch">{{ 'auth.newHere' | translate }} <a routerLink="/sign-up">{{ 'auth.createAccount' | translate }}</a></p>
  </form>
</ms-auth-frame>
