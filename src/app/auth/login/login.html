<ms-auth-frame [title]="'auth.signInTitle' | translate">
  <form class="ms-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (expired()) {
      <p class="form-note" role="status"><mat-icon>schedule</mat-icon>{{ 'errors.sessionExpired' | translate }}</p>
    }

    <mat-form-field>
      <mat-label>{{ 'auth.login' | translate }}</mat-label>
      <input matInput formControlName="login" autocomplete="username" autocapitalize="off" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'auth.password' | translate }}</mat-label>
      <input matInput [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
      <button matIconButton matSuffix type="button" (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="(showPassword() ? 'auth.hidePassword' : 'auth.showPassword') | translate">
        <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    @if (error()) {
      <p class="form-error" role="alert"><mat-icon>error</mat-icon>{{ error() }}</p>
    }

    <div class="auth-actions">
      <a routerLink="/forgot-password">{{ 'auth.forgot' | translate }}</a>
      <button matButton="filled" type="submit" class="submit" [disabled]="busy()">
        {{ 'auth.signIn' | translate }}
      </button>
    </div>
    <p class="auth-switch">{{ 'auth.newHere' | translate }} <a routerLink="/sign-up">{{ 'auth.createAccount' | translate }}</a></p>
  </form>
</ms-auth-frame>
