<ms-auth-frame [title]="'auth.verifyTitle' | translate">
  <div class="result" role="status">
    @switch (state()) {
      @case ('checking') {
        <p-progress-spinner strokeWidth="4" [style]="{ width: '40px', height: '40px' }" />
        <p class="muted">{{ 'auth.verifying' | translate }}</p>
      }
      @case ('done') {
        <span class="big-icon"><i class="icon pi pi-check-circle"></i></span>
        <h2 class="page-title">{{ 'auth.verified' | translate }}</h2>
        <a pButton routerLink="/login"><span pButtonLabel>{{ 'auth.signIn' | translate }}</span></a>
      }
      @default {
        <span class="big-icon danger"><i class="icon pi pi-ban"></i></span>
        <p class="form-error"><i class="icon pi pi-exclamation-circle"></i>{{ error() ?? ('auth.linkInvalid' | translate) }}</p>
        <a pButton routerLink="/login" [text]="true"><span pButtonLabel>{{ 'auth.backToSignIn' | translate }}</span></a>
      }
    }
  </div>
</ms-auth-frame>
