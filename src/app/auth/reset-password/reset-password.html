<ms-auth-frame [title]="'auth.resetTitle' | translate">
  @if (done()) {
    <div class="done" role="status">
      <span class="big-icon"><i class="icon pi pi-lock"></i></span>
      <p>{{ 'auth.passwordSaved' | translate }}</p>
      <a pButton routerLink="/login"><span pButtonLabel>{{ 'auth.signIn' | translate }}</span></a>
    </div>
  } @else {
    <form class="ms-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="ms-field">
        <label msLabel for="password" control="password" error="errors.passwordShort">{{ 'auth.newPassword' | translate }}</label>
        <input pInputText id="password" type="password" formControlName="password" autocomplete="new-password" />
        <small class="field-hint">{{ 'errors.passwordShort' | translate }}</small>
      </div>
      <div class="ms-field">
        <label msLabel for="confirm" control="confirm" error="errors.passwordsDiffer"
               [invalid]="form.controls.confirm.dirty && form.hasError('notSame')">{{ 'auth.confirmPassword' | translate }}</label>
        <input pInputText id="confirm" type="password" formControlName="confirm" autocomplete="new-password" />
      </div>
      @if (error()) {
        <p class="form-error" role="alert"><i class="icon pi pi-exclamation-circle"></i>{{ error() }}</p>
      }
      <div class="auth-actions">
        <a routerLink="/login">{{ 'auth.backToSignIn' | translate }}</a>
        <button pButton type="submit" [loading]="busy()" [disabled]="busy()"><span pButtonLabel>{{ 'auth.setPassword' | translate }}</span></button>
      </div>
    </form>
  }
</ms-auth-frame>
