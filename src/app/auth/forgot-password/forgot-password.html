<ms-auth-frame [title]="'auth.forgotTitle' | translate">
  @if (sent(); as sent) {
    <div class="done" role="status">
      <span class="big-icon"><i class="icon pi pi-send"></i></span>
      <p>{{ 'auth.linkSent' | translate }}</p>
      @if (sent.devLink) {
        <a class="form-note dev-link" [href]="devPath(sent.devLink)"><i class="icon pi pi-code"></i>{{ 'auth.devLink' | translate }}</a>
      }
      <a pButton routerLink="/login" [text]="true"><span pButtonLabel>{{ 'auth.backToSignIn' | translate }}</span></a>
    </div>
  } @else {
    <form class="ms-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <p class="muted">{{ 'auth.forgotLead' | translate }}</p>
      <div class="ms-field">
        <label msLabel for="email" control="email" error="errors.email">{{ 'auth.email' | translate }}</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <p class="form-note"><i class="icon pi pi-info-circle"></i>{{ 'auth.forgotNoEmail' | translate }}</p>
      <div class="auth-actions">
        <a routerLink="/login">{{ 'auth.backToSignIn' | translate }}</a>
        <button pButton type="submit" [loading]="busy()" [disabled]="busy()"><span pButtonLabel>{{ 'auth.sendLink' | translate }}</span></button>
      </div>
    </form>
  }
</ms-auth-frame>
