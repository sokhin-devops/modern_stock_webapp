<p-dialog [(visible)]="visible" [modal]="true" [draggable]="false" styleClass="ms-dialog ms-full-dialog" [header]="'credits.' + kind() + '.new' | translate">
  <div class="ms-form dialog-form">
    <p class="muted">{{ 'credits.' + kind() + '.newLead' | translate }}</p>
    <div class="ms-field">
      <label msLabel for="credit-party" required>{{ 'credits.' + kind() + '.party' | translate }}</label>
      <ms-pick [kind]="config().parties === '/suppliers' ? 'supplier' : 'customer'" inputId="credit-party" [value]="party()" (picked)="pick($event)" />
    </div>
    <div class="ms-field">
      <label msLabel for="credit-new-amount" required>{{ 'credits.amountUsd' | translate }}</label>
      <p-inputnumber size="small" inputId="credit-new-amount" [ngModel]="amount()" (ngModelChange)="amount.set($event)" mode="currency" currency="USD" locale="en-US" [min]="0" />
    </div>
    <div class="ms-field">
      <label msLabel for="credit-reason" required>{{ 'credits.reason' | translate }}</label>
      <input pInputText pSize="small" id="credit-reason" [ngModel]="reason()" (ngModelChange)="reason.set($event)" maxlength="255" />
    </div>
  </div>
  <ng-template #footer>
    <button pButton size="small" type="button" (click)="submit()" [loading]="busy()"
            [disabled]="busy() || !party() || !amount() || !reason().trim()"><span pButtonLabel>{{ 'common.save' | translate }}</span></button>
  </ng-template>
</p-dialog>
