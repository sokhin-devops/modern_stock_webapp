<button class="avatar" type="button" (click)="menu.toggle($event)" aria-haspopup="menu" [attr.aria-label]="'shell.account' | translate">
  {{ initial() }}
</button>

<p-menu #menu [model]="items()" [popup]="true" appendTo="body" styleClass="account-menu">
  <ng-template #start>
    <div class="menu-head">
      <span class="avatar">{{ initial() }}</span>
      <div>
        <b>{{ auth.user()?.fullName }}</b>
        <div class="muted small">{{ login() }}</div>
      </div>
    </div>
  </ng-template>
</p-menu>
