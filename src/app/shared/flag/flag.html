@if (lang() === 'en') {
  <!-- Union Jack; the red diagonals are offset from the white ones, as on the real flag -->
  <svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <clipPath [attr.id]="clipId"><path d="M30 15h30v15zv15H0zH0V0zV0h30z" /></clipPath>
    <rect width="60" height="30" fill="#012169" />
    <path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6" />
    <path d="M0 0l60 30m0-30L0 30" stroke="#c8102e" stroke-width="4" [attr.clip-path]="'url(#' + clipId + ')'" />
    <path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10" />
    <path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6" />
  </svg>
} @else {
  <!-- Cambodia: Angkor Wat (five towers on a stepped base) on the red band -->
  <svg viewBox="0 0 60 40" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="60" height="40" fill="#032ea1" />
    <rect y="10" width="60" height="20" fill="#e00025" />
    <g fill="#fff">
      <rect x="17" y="27.6" width="26" height="1.4" />
      <rect x="18.5" y="26" width="23" height="1.6" />
      <rect x="19.5" y="23" width="21" height="3" />
      <path d="M28.4 23v-6l.6-1.4.4-2L30 11.5l.6 2.1.4 2 .6 1.4v6z" />
      <path d="M23.9 23v-4.4l.5-1.2.6-2.4.6 2.4.5 1.2V23zm10 0v-4.4l.5-1.2.6-2.4.6 2.4.5 1.2V23z" />
      <path d="M20.2 23v-2.8l.4-1 .4-1.6.4 1.6.4 1V23zm18 0v-2.8l.4-1 .4-1.6.4 1.6.4 1V23z" />
    </g>
  </svg>
}
