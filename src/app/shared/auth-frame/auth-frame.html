<main class="auth">
  <div class="auth-card">
    <div class="auth-side">
      <span class="logo logo-lg"><mat-icon>inventory_2</mat-icon></span>
      <h1 class="auth-title">{{ title() }}</h1>
      <p class="auth-sub">{{ sub() }}</p>
    </div>
    <div class="auth-form">
      <ng-content />
    </div>
  </div>
  <div class="auth-below">
    <a class="website-link" [href]="websiteUrl + '/' + lang.lang()">
      <mat-icon>arrow_back</mat-icon>{{ 'account.website' | translate }}
    </a>
    <span class="below-actions">
      <ms-lang-button />
      <button matIconButton type="button" (click)="theme.toggle()"
              [attr.aria-label]="(theme.dark() ? 'common.lightMode' : 'common.darkMode') | translate">
        <mat-icon>{{ theme.dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </span>
  </div>
</main>
