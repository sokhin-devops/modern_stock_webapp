<main class="auth">
  <div class="auth-card">
    <div class="auth-side">
      <span class="logo logo-lg"><i class="icon pi pi-box"></i></span>
      <h1 class="auth-title">{{ title() }}</h1>
      <p class="auth-sub">{{ sub() }}</p>
    </div>
    <div class="auth-form">
      <ng-content />
    </div>
  </div>
  <div class="auth-below">
    <a class="website-link" [href]="websiteUrl + '/' + lang.lang()">
      <i class="icon pi pi-arrow-left"></i>{{ 'account.website' | translate }}
    </a>
    <span class="below-actions">
      <ms-lang-button />
      <button pButton type="button" [rounded]="true" [text]="true" severity="secondary" (click)="theme.toggle()"
              [attr.aria-label]="(theme.dark() ? 'common.lightMode' : 'common.darkMode') | translate">
        <i class="pi" [class.pi-sun]="theme.dark()" [class.pi-moon]="!theme.dark()" pButtonIcon></i>
      </button>
    </span>
  </div>
</main>
