<div class="shell no-sidebar">
  <header class="topbar">
    <a class="site-logo" routerLink="/businesses">
      <span class="logo"><i class="icon pi pi-box"></i></span><b>ModernStock</b>
    </a>
    <span class="spacer"></span>
    <div class="topbar-actions">
      <ms-lang-button />
      <button pButton type="button" [rounded]="true" [text]="true" severity="secondary" (click)="theme.toggle()"
              [attr.aria-label]="(theme.dark() ? 'common.lightMode' : 'common.darkMode') | translate">
        <i class="pi" [class.pi-sun]="theme.dark()" [class.pi-moon]="!theme.dark()" pButtonIcon></i>
      </button>
      <ms-account-menu />
    </div>
  </header>
  <main class="main"><router-outlet /></main>
</div>
