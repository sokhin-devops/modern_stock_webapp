<div class="shell no-sidebar">
  <header class="topbar">
    <a class="site-logo" routerLink="/businesses">
      <span class="logo"><mat-icon>inventory_2</mat-icon></span><b>ModernStock</b>
    </a>
    <span class="spacer"></span>
    <div class="topbar-actions">
      <ms-lang-button />
      <button matIconButton type="button" (click)="theme.toggle()"
              [attr.aria-label]="(theme.dark() ? 'common.lightMode' : 'common.darkMode') | translate">
        <mat-icon>{{ theme.dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <ms-account-menu />
    </div>
  </header>
  <main class="main"><router-outlet /></main>
</div>
