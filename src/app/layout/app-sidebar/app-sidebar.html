<nav class="sidebar" [class.rail]="rail()" [attr.aria-label]="'shell.mainMenu' | translate">
  @for (item of items(); track item.id) {
    @if (item.children) {
      <div class="nav-group" [class.open]="isOpen(item)" [class.current]="isCurrent(item)">
        <!-- Icons only: the group's pages open in a flyout menu beside the icon -->
        <button class="nav-item" type="button" (click)="rail() ? openFlyout($event, item) : toggle(item)"
                [attr.aria-expanded]="rail() ? null : isOpen(item)" [attr.aria-haspopup]="rail() ? 'menu' : null"
                [pTooltip]="item.label | translate" tooltipPosition="right" [tooltipDisabled]="!rail()">
          <i class="icon" [class]="item.icon"></i>
          <span class="nav-label">{{ item.label | translate }}</span>
          <i class="icon pi pi-chevron-down chev"></i>
        </button>
        <div class="nav-sub">
          <div class="nav-sub-inner">
            @for (page of item.children; track page.path) {
              <a [routerLink]="'/' + page.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                 (click)="navigate.emit()">{{ page.label | translate }}</a>
            }
          </div>
        </div>
      </div>
    } @else {
      <a class="nav-item" [routerLink]="'/' + item.path" routerLinkActive="active" (click)="navigate.emit()"
         [pTooltip]="item.label | translate" tooltipPosition="right" [tooltipDisabled]="!rail()">
        <i class="icon" [class]="item.icon"></i>
        <span class="nav-label">{{ item.label | translate }}</span>
      </a>
    }
    @if (item.divider) {
      <div class="nav-sep" role="separator"></div>
    }
  }

  <!-- Only computers can switch: tablets always show icons, phones always the full menu -->
  @if (!screen.tablet() && !screen.phone()) {
    <div class="sidebar-footer">
      <button class="nav-item" type="button" (click)="collapse.emit()"
              [pTooltip]="'shell.expand' | translate" tooltipPosition="right" [tooltipDisabled]="!rail()">
        <i class="icon pi" [class.pi-angle-double-right]="rail()" [class.pi-angle-double-left]="!rail()"></i>
        <span class="nav-label">{{ (rail() ? 'shell.expand' : 'shell.collapse') | translate }}</span>
      </button>
    </div>
  }
</nav>

<p-menu #flyout [model]="flyoutItems()" [popup]="true" appendTo="body" (onShow)="placeFlyout()" />
