<nav class="sidebar" [attr.aria-label]="'shell.mainMenu' | translate">
  @for (item of items(); track item.id) {
    @if (item.children) {
      <div class="nav-group" [class.open]="isOpen(item)" [class.current]="isCurrent(item)">
        <button class="nav-item" type="button" (click)="toggle(item)" [attr.aria-expanded]="isOpen(item)"
                [matTooltip]="collapsed() ? (item.label | translate) : ''" matTooltipPosition="right">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span class="nav-label">{{ item.label | translate }}</span>
          <mat-icon class="chev">expand_more</mat-icon>
        </button>
        <div class="nav-sub">
          <div class="nav-sub-inner">
            @for (page of item.children; track page.path) {
              <a [routerLink]="'/' + page.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                 (click)="navigate.emit()">{{ page.label | translate }}</a>
            }
          </div>
        </div>
      </div>
    } @else {
      <a class="nav-item" [routerLink]="'/' + item.path" routerLinkActive="active" (click)="navigate.emit()"
         [matTooltip]="collapsed() ? (item.label | translate) : ''" matTooltipPosition="right">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label | translate }}</span>
      </a>
    }
    @if (item.divider) {
      <div class="nav-sep" role="separator"></div>
    }
  }

  <div class="sidebar-footer">
    <button class="nav-item" type="button" (click)="collapse.emit()"
            [matTooltip]="collapsed() ? ('shell.expand' | translate) : ''" matTooltipPosition="right">
      <mat-icon class="collapse-icon">{{ collapsed() ? 'left_panel_open' : 'left_panel_close' }}</mat-icon>
      <span class="nav-label">{{ (collapsed() ? 'shell.expand' : 'shell.collapse') | translate }}</span>
    </button>
  </div>
</nav>
